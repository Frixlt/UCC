# Mutually exclusive blacklist preventing tuxedo-drivers modules from conflicting
# with uwcc_rs over ACPI INOU0000 EC access and ITE USB HID lighting devices (ADR-05).

blacklist tuxedo_io
blacklist uniwill_wmi
blacklist tuxedo_keyboard
blacklist tuxedo_nb02_nvidia_power_ctrl
blacklist ite_8291
blacklist ite_8291_lb
