PACKAGE_NAME="uwcc-rs"
PACKAGE_VERSION="0.0.1"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_CONFIG="CONFIG_RUST"

BUILT_MODULE_NAME[0]="uwcc_rs"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KDIR=${kernel_source_dir} KVER=${kernelver} modules"
CLEAN="make KDIR=${kernel_source_dir} KVER=${kernelver} clean"
