<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
        <type>system</type>
        <policy user="root">
                <allow own="com.uniwill.uccd" />
                <allow own="de.uniwill.uccd" />
                <allow send_destination="com.uniwill.uccd" />
                <allow send_destination="de.uniwill.uccd" />
                <allow receive_sender="com.uniwill.uccd" />
                <allow receive_sender="de.uniwill.uccd" />
        </policy>
        <policy context="default">
                <allow send_destination="com.uniwill.uccd"
                       send_interface="com.uniwill.uccd"
                       send_type="method_call" />
                <allow send_destination="com.uniwill.uccd"
                       send_interface="de.uniwill.uccd"
                       send_type="method_call" />
                <allow send_destination="com.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Introspectable"
                       send_type="method_call" />
                <allow send_destination="com.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_type="method_call" />
                <allow send_destination="com.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Peer"
                       send_type="method_call" />
                <allow send_destination="de.uniwill.uccd"
                       send_interface="de.uniwill.uccd"
                       send_type="method_call" />
                <allow send_destination="de.uniwill.uccd"
                       send_interface="com.uniwill.uccd"
                       send_type="method_call" />
                <allow send_destination="de.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Introspectable"
                       send_type="method_call" />
                <allow send_destination="de.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_type="method_call" />
                <allow send_destination="de.uniwill.uccd"
                       send_interface="org.freedesktop.DBus.Peer"
                       send_type="method_call" />
                <allow receive_sender="com.uniwill.uccd"
                       receive_type="signal"
                       receive_interface="com.uniwill.uccd" />
                <allow receive_sender="com.uniwill.uccd"
                       receive_type="signal"
                       receive_interface="de.uniwill.uccd" />
                <allow receive_sender="de.uniwill.uccd"
                       receive_type="signal"
                       receive_interface="de.uniwill.uccd" />
        </policy>
</busconfig>
