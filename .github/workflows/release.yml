name: Release Staging

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-dist:
    name: Verify versions, workspace tests, kernel UAPI & vendored archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install D-Bus runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-staging-1.99.1

      - name: Verify version parity across all manifests
        run: cargo run -p xtask --locked -- check-versions

      - name: Verify release tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL_VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/.*version *= *"|".*/,""); print; exit}' Cargo.toml)"
          if [ "$EXPECTED_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "Release tag ${GITHUB_REF_NAME} (${EXPECTED_VERSION}) does not match Cargo.toml version (${ACTUAL_VERSION})" >&2
            exit 1
          fi

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: dbus-run-session -- cargo test --workspace --locked --no-fail-fast

      - name: Verify uwcc-rs kernel no_std tests & packaging syntax
        run: |
          rustc --edition 2021 --test kernel/uwcc-rs/src/ring_buffer.rs -o /tmp/uwcc_ring_buffer_test
          /tmp/uwcc_ring_buffer_test
          rustc --edition 2021 --test kernel/uwcc-rs/src/validation.rs -o /tmp/uwcc_validation_test
          /tmp/uwcc_validation_test
          bash -n kernel/uwcc-rs/packaging/arch/PKGBUILD
          bash -n kernel/uwcc-rs/dkms.conf

      - name: Build vendored release source archive
        run: make dist

      - name: Smoke-test offline build from unpacked vendored tarball
        run: |
          TMPDIR="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$TMPDIR"
          SRC_DIR="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          (cd "$SRC_DIR" && cargo check --workspace --offline --locked)
          rm -rf "$TMPDIR"

      - name: Build release binaries & stage manifest/SBOM
        run: |
          cargo build --workspace --bins --release --locked
          cargo run -p xtask --locked -- dist dist/stage target/release

      - name: Upload release source tarball, manifest, and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/stage/share/doc/ucc/RELEASE_MANIFEST.json
            dist/stage/share/doc/ucc/SBOM.json
