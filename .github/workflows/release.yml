name: Release Staging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  verify-and-dist:
    name: Verify versions, workspace tests, and source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install D-Bus runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: clippy

      - name: Verify version parity across all manifests
        run: cargo run -p xtask --locked -- check-versions

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: dbus-run-session -- cargo test --workspace --locked --no-fail-fast

      - name: Build vendored release source archive
        run: make dist

      - name: Upload source tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
