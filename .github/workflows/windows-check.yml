name: Windows Port & Cross-Platform Check

permissions:
  contents: read

on:
  push:
    branches: [main, rust/migration, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-contract-tests:
    name: Linux Windows-seam contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-linux-contracts
      - name: IPC & Named Pipe framing contract tests
        run: cargo test -p ucc-dbus --locked --test named_pipe_ipc --test ipc_framing
      - name: Windows WMI, power/display/lid, and WinRT BLE contract tests
        run: cargo test -p ucc-hardware --locked --test windows_wmi_backend --test windows_power_display_lid --test winrt_ble_cooler
      - name: Windows & shared HID lighting contract tests
        run: cargo test -p ucc-lighting --locked --test windows_hid_transport --test hid_transport
      - name: Cross-platform config path contract tests
        run: cargo test -p ucc-config --locked --test windows_platform_paths
      - name: Windows service lifecycle contract tests
        run: cargo test -p uccd --locked --test windows_service_lifecycle

  windows-gnu-cross-check:
    name: Cross-check (x86_64-pc-windows-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross-toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-gnu-cross
      # Restricted to currently Windows-clean crates; ucc-hardware (and ucc-lighting/uccd
      # via ucc-hardware) awaits Unix-gating of `nix` in crates/ucc-hardware/Cargo.toml.
      - name: Cross-check portable crates for Windows GNU
        run: cargo check -p ucc-core -p ucc-config -p ucc-dbus --target x86_64-pc-windows-gnu --locked

  windows-msvc-check:
    name: Native Windows MSVC clippy & tests (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-msvc-native
      # Restricted to currently Windows-clean crates; ucc-hardware (and ucc-lighting/uccd
      # via ucc-hardware) awaits Unix-gating of `nix` in crates/ucc-hardware/Cargo.toml.
      - name: Clippy on Windows MSVC
        run: cargo clippy -p ucc-core -p ucc-config -p ucc-dbus --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - name: Run portable crate test suites on Windows MSVC
        run: |
          cargo test -p ucc-core --target x86_64-pc-windows-msvc --locked --no-fail-fast
          cargo test -p ucc-config --target x86_64-pc-windows-msvc --locked --no-fail-fast
          cargo test -p ucc-dbus --target x86_64-pc-windows-msvc --locked --no-fail-fast
