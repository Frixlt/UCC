name: Nix

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'package.nix'
      - 'default.nix'
      - 'treefmt.nix'
      - 'nix/**'
      - 'Cargo.lock'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-check-and-build:
    name: nix flake check, module eval & build .#ucc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Show flake metadata
        run: nix flake metadata

      - name: Evaluate NixOS module
        run: |
          nix eval .#nixosModules.uccd --apply 'm: builtins.isFunction m || builtins.isAttrs m'

      - name: Run flake checks (build, formatting)
        run: nix flake check --print-build-logs

      - name: Build .#ucc and report closure size
        run: |
          nix build .#ucc --print-build-logs
          nix path-info -sSh ./result
