name: Build & Test (KDE Neon)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cmake (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    container:
      image: invent-registry.kde.org/neon/docker-images/plasma:unstable
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, RelWithDebInfo]

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            ninja-build \
            pkg-config \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-connectivity-dev \
            qt6-tools-dev \
            qt6-declarative-dev \
            qt6-charts-dev \
            libkf6config-dev \
            libkf6coreaddons-dev \
            libplasma-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libxcb1-dev \
            libkf6windowsystem-dev \
            libkf6statusnotifieritem-dev \
            qt6-svg-dev \
            dbus gjs nodejs python3 fonts-dejavu-core \
            nlohmann-json3-dev \
            libsystemd-dev \
            libxrandr-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_GUI=ON \
            -DBUILD_TRAY=ON \
            -DBUILD_GNOME=ON \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --parallel 1 -E '^test_gui_audit$'

      - name: Run focused GUI checks
        run: |
          dbus-run-session -- bash tests/run_gui_audit_test.sh \
            "$PWD/build/bin/test_gui_audit" \
            dashboardShowsDriverFailureAndClearsAfterRecovery \
            aboutBuildCreditsAndBundledLicense calibratedKeyboardKeepsPhysicalLedIdentities \
            lightbarKeepsSourceValuesAndRejectsFailedCommands deviceMatrixKeepsThreeIndependentModes

      - name: Capture current GUI pages on an isolated bus
        run: python3 contrib/frixit/capture-gallery.py --build build --output artifacts/ci-gallery

      - name: Upload compile_commands.json
        if: matrix.build_type == 'RelWithDebInfo'
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json
          if-no-files-found: warn
          retention-days: 7
